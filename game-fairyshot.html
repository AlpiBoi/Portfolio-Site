                                <li role="none"><a role="menuitem" href="game-cowza.html">Cowza</a></li>

    <main>
        <!-- Unity WebGL inline integration -->
        <section aria-label="Play FairyShot" class="game-section">

                </div>

        </section>
        <section>
            <h1>FairyShot</h1>

            <ul>
                <li>Unity 6.2</li>

    <footer>
        <p>© 2026 Adam Desrosiers</p>

    <script src="script.js"></script>

    <!-- Unity loader & configuration (paths adjusted to games/FairyShot) -->
    <script>
      (function () {
        var canvas = document.querySelector("#unity-canvas");

        function unityShowBanner(msg, type) {
          var warningBanner = document.querySelector("#unity-warning");
          function updateBannerVisibility() {
            warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
          }
          var div = document.createElement('div');
          div.innerHTML = msg;
          warningBanner.appendChild(div);
          if (type == 'error') div.style = 'background: red; padding: 10px;';
          else {
            if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
            setTimeout(function() {
              try { warningBanner.removeChild(div); } catch(e) {}
              updateBannerVisibility();
            }, 5000);
          }
          updateBannerVisibility();
        }

        // Adjusted build path so resources load from the FairyShot folder
        var buildUrl = "games/FairyShot/Build";

        async function probe(url) {
          try {
            // HEAD works best if server allows it; fall back to GET with range
            var res = await fetch(url, { method: 'HEAD' });
            if (res && (res.ok || res.status === 200)) return true;
            // try a small GET; some servers block HEAD
            res = await fetch(url, { method: 'GET', headers: { Range: 'bytes=0-0' } });
            return res && (res.ok || res.status === 200 || res.status === 206);
          } catch (e) {
            return false;
          }
        }

        async function chooseBuildFiles() {
          // priority: brotli (.br) -> gzip (.gz) -> no compression
          var variants = [
            { ext: '.br', enc: 'br' },
            { ext: '.gz', enc: 'gzip' },
            { ext: '', enc: null }
          ];

          for (var i = 0; i < variants.length; i++) {
            var v = variants[i];
            // test data file (covers the rest)
            var testUrl = buildUrl + "/Build.data" + v.ext;
            var ok = await probe(testUrl);
            if (ok) {
              return {
                dataUrl: buildUrl + "/Build.data" + v.ext,
                frameworkUrl: buildUrl + "/Build.framework.js" + v.ext,
                codeUrl: buildUrl + "/Build.wasm" + v.ext,
                loaderUrl: buildUrl + "/Build.loader.js", // loader usually uncompressed
                contentEncoding: v.enc
              };
            }
          }
          // fallback to original names (if probes fail)
          return {
            dataUrl: buildUrl + "/Build.data",
            frameworkUrl: buildUrl + "/Build.framework.js",
            codeUrl: buildUrl + "/Build.wasm",
            loaderUrl: buildUrl + "/Build.loader.js",
            contentEncoding: null
          };
        }

        (async function init() {
          var chosen = await chooseBuildFiles();

          var config = {
            arguments: [],
            dataUrl: chosen.dataUrl,
            frameworkUrl: chosen.frameworkUrl,
            codeUrl: chosen.codeUrl,
            streamingAssetsUrl: "games/FairyShot/StreamingAssets",
            companyName: "RoseboxGames",
            productName: "FairyShot",
            productVersion: "1.0",
            showBanner: unityShowBanner
          };

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
          } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
          }

          document.querySelector("#unity-loading-bar").style.display = "block";

          var script = document.createElement("script");
          script.src = chosen.loaderUrl;
          script.onload = () => {
            // createUnityInstance is provided by the loader
            createUnityInstance(canvas, config, (progress) => {
              var prog = document.querySelector("#unity-progress-bar-full");
              if (prog) prog.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
              var bar = document.querySelector("#unity-loading-bar");
              if (bar) bar.style.display = "none";
              var fs = document.querySelector("#unity-fullscreen-button");
              if (fs) fs.onclick = () => { unityInstance.SetFullscreen(1); };
            }).catch((message) => {
              unityShowBanner(message, 'error');
              console.error(message);
            });
          };
          script.onerror = function (e) {
            unityShowBanner("Failed to load Unity loader script: " + chosen.loaderUrl, 'error');
            console.error(e);
          };
          document.body.appendChild(script);
        })();

      })();
    </script>
</body>
</html>
